name: Checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pip install 'numpy>=1.26,<2' 'scipy>=1.12,<2'
      - run: python -m compileall -q -x '(.venv|node_modules|data|outputs|legacy)' .
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.mjs
      - run: node --input-type=module --check < web/app.js
