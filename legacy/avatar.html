<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>ИИ-Родитель</title>
<style>
  html, body { margin:0; height:100%; background:#0a0a0a; overflow:hidden; font-family: sans-serif; }
  #scene { position:absolute; inset:0; }
  #hud {
    position:absolute; bottom:24px; left:0; right:0; text-align:center;
    color:#fff; font-size:22px; letter-spacing:1px; text-shadow:0 0 8px #000;
    pointer-events:none;
  }
  #setup {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:16px; color:#fff; background:rgba(0,0,0,0.85); z-index:10;
    text-align:center; padding:20px;
  }
  #setup button { padding:12px 28px; font-size:16px; cursor:pointer; }
  #setup video { width:400px; max-width:80vw; border-radius:8px; transform:scaleX(-1); }

</style>

<body>

<div id="setup">
  <h2>Настройка ИИ-родителя</h2>
  <p id="setupText">Сядь ровно перед камерой, смотри прямо в объектив.<br/>
     Нажми «Сканировать» и не двигайся ~3 секунды.</p>
  <video id="setupVideo" autoplay playsinline muted></video>
  <div id="countdown"></div>

<div id="scene"></div>
<video id="cam" autoplay playsinline muted></video>
<canvas id="capture"></canvas>
<div id="hud"></div>
<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

// ================= НАСТРОЙКИ =================
const MISSING_THRESHOLD = 5.0;
const RETURN_THRESHOLD  = 2.0;
const PHRASES_MANIFEST  = "phrases/manifest.json";
const CANONICAL_OBJ_URL = "https://raw.githubusercontent.com/google-ai-edge/mediapipe/master/mediapipe/modules/face_geometry/data/canonical_face_model.obj";
const SCAN_DURATION_MS  = 3000;
const HOLD_DURATION_MS  = 1800;   // сколько держать каждый ракурс при сканировании
const MESH_SCALE = 4.2;   // если лицо выглядит слишком большим/маленьким — крути это число

// Последовательность ракурсов при сканировании: сначала анфас (по нему строится
// сама 3D-форма), затем в стороны — эти кадры используются только чтобы
// добрать текстуру там, где анфас даёт мало деталей (виски, скулы, боковая
// часть носа/подбородка).
const POSES = [
  { key: "front", instruction: "Смотри прямо в камеру" },
  { key: "left",  instruction: "Медленно поверни голову налево и держи" },
  { key: "right", instruction: "Медленно поверни голову направо и держи" },
];

// Индексы вершин внутреннего контура рта (взято из официальной топологии
// MediaPipe FaceMesh) — используются для эффекта открывания рта под звук.
const MOUTH_INDICES = [78,191,95,80,88,81,178,82,87,13,312,317,402,311,318,310,324,415,308];
// ===============================================

const hud = document.getElementById("hud");
const errBox = document.getElementById("err");
const setupPanel = document.getElementById("setup");
const setupTextEl = document.getElementById("setupText");
const setupVideo = document.getElementById("setupVideo");
const countdownEl = document.getElementById("countdown");
const scanBtn = document.getElementById("scanBtn");

function showError(msg) {
  console.error(msg);
  errBox.textContent = msg;
}

// ---------- Состояние мониторинга ----------
let state = "FOCUS";
let missingStart = 0, returnStart = 0;
let faceDetected = true;
let phrases = [];
let currentAudioEl = null, analyser = null, audioCtx = null, timeData = null;

// ---------- Three.js ----------
let renderer, scene, camera, faceMesh, headPlaceholder;
let basePositions = null;   // Float32Array — позиции вершин ДО анимации рта
let liveGeometry = null;

function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05050a);
  camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.05, 100);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById("scene").appendChild(renderer.domElement);

  scene.add(new THREE.DirectionalLight(0xffffff, 1.6).translateX(1).translateY(2).translateZ(2));
  scene.add(new THREE.AmbientLight(0x8899aa, 0.8));

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// ---------- Загрузка топологии: треугольники + UV-координаты ----------
async function fetchCanonicalTopology() {
  const res = await fetch(CANONICAL_OBJ_URL);
  if (!res.ok) throw new Error("не удалось загрузить canonical_face_model.obj (нужен интернет при первом запуске)");
  const text = await res.text();

  const vtList = [];   // [[u,v], ...]
  const faces = [];    // [[[vIdx,vtIdx],[vIdx,vtIdx],[vIdx,vtIdx]], ...] (уже триангулировано)

  for (const line of text.split("\n")) {
    if (line.startsWith("vt ")) {
      const [, u, v] = line.trim().split(/\s+/);
      vtList.push([parseFloat(u), parseFloat(v)]);
    } else if (line.startsWith("f ")) {
      const corners = line.trim().split(/\s+/).slice(1).map((p) => {
        const [vIdx, vtIdx] = p.split("/");
        return [parseInt(vIdx, 10) - 1, parseInt(vtIdx, 10) - 1];
      });
      for (let i = 1; i < corners.length - 1; i++) {
        faces.push([corners[0], corners[i], corners[i + 1]]);
      }
    }
  }
  return { faces, vtList };
}

// ---------- Заливка текстурного атласа реальным фото по треугольникам ----------
function affineSetTransform(ctx, src, dst) {
  const [[x0, y0], [x1, y1], [x2, y2]] = src;
  const [[u0, v0], [u1, v1], [u2, v2]] = dst;
  const denom = x0 * (y1 - y2) + x1 * (y2 - y0) + x2 * (y0 - y1);
  if (Math.abs(denom) < 1e-8) return false;

  const a = (u0 * (y1 - y2) + u1 * (y2 - y0) + u2 * (y0 - y1)) / denom;
  const b = (v0 * (y1 - y2) + v1 * (y2 - y0) + v2 * (y0 - y1)) / denom;
  const c = (u0 * (x2 - x1) + u1 * (x0 - x2) + u2 * (x1 - x0)) / denom;
  const d = (v0 * (x2 - x1) + v1 * (x0 - x2) + v2 * (x1 - x0)) / denom;
  const e = (u0 * (x1 * y2 - x2 * y1) + u1 * (x2 * y0 - x0 * y2) + u2 * (x0 * y1 - x1 * y0)) / denom;
  const f = (v0 * (x1 * y2 - x2 * y1) + v1 * (x2 * y0 - x0 * y2) + v2 * (x0 * y1 - x1 * y0)) / denom;
  ctx.setTransform(a, b, c, d, e, f);
  return true;
}

function triangleArea2D(pts) {
  const [[x0, y0], [x1, y1], [x2, y2]] = pts;
  return Math.abs((x1 - x0) * (y2 - y0) - (x2 - x0) * (y1 - y0));
}

function sampleAvgColor(canvas, xNorm, yNorm, radius = 6) {
  const ctx = canvas.getContext("2d");
  const cx = Math.round(xNorm * canvas.width);
  const cy = Math.round(yNorm * canvas.height);
  const x = Math.max(0, cx - radius), y = Math.max(0, cy - radius);
  const w = Math.min(canvas.width - x, radius * 2), h = Math.min(canvas.height - y, radius * 2);
  const data = ctx.getImageData(x, y, Math.max(1, w), Math.max(1, h)).data;
  let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < data.length; i += 4) { r += data[i]; g += data[i + 1]; b += data[i + 2]; n++; }
  return n ? [r / n, g / n, b / n] : [180, 140, 120];
}

function applyGain(canvas, gain) {
  const ctx = canvas.getContext("2d");
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    d[i]     = Math.min(255, d[i] * gain[0]);
    d[i + 1] = Math.min(255, d[i + 1] * gain[1]);
    d[i + 2] = Math.min(255, d[i + 2] * gain[2]);
  }
  ctx.putImageData(img, 0, 0);
}

// "анфас"/"налево"/"направо" снимаются в разные моменты — автоэкспозиция
// камеры между ними успевает поплыть, из-за чего на стыке треугольников из
// разных ракурсов виден шов по яркости/оттенку. Подгоняем left/right под
// цвет front по стабильной точке между бровей — грубо, но убирает резкие швы.
function colorMatchPoses(poseResults) {
  const refLm = poseResults.front.avg[6];
  const refColor = sampleAvgColor(poseResults.front.canvas, refLm.x, refLm.y);
  for (const key of ["left", "right"]) {
    const pose = poseResults[key];
    if (!pose) continue;
    const lm = pose.avg[6];
    const c = sampleAvgColor(pose.canvas, lm.x, lm.y);
    const clamp = (g) => Math.min(1.6, Math.max(0.6, g));
    applyGain(pose.canvas, [
      clamp(refColor[0] / (c[0] || 1)),
      clamp(refColor[1] / (c[1] || 1)),
      clamp(refColor[2] / (c[2] || 1)),
    ]);
  }
}

function averageColorInTriangle(canvas, pts) {
  const ctx = canvas.getContext("2d");
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const x0 = Math.max(0, Math.floor(Math.min(...xs)));
  const y0 = Math.max(0, Math.floor(Math.min(...ys)));
  const x1 = Math.min(canvas.width, Math.ceil(Math.max(...xs)));
  const y1 = Math.min(canvas.height, Math.ceil(Math.max(...ys)));
  const w = Math.max(1, x1 - x0), h = Math.max(1, y1 - y0);
  const data = ctx.getImageData(x0, y0, w, h).data;
  let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < data.length; i += 4) { r += data[i]; g += data[i + 1]; b += data[i + 2]; n++; }
  return n ? [r / n, g / n, b / n] : [180, 140, 120];
}

// Для каждого треугольника берём тот ракурс (фас/лево/право), в котором он
// меньше всего "завален" по углу камеры — оцениваем по площади проекции:
// чем больше площадь, тем меньше искажение перспективой, тем чище текстура.
// ВАЖНО: раньше треугольники с маленькой площадью во всех ракурсах просто
// пропускались (оставалась голая подложка — те самые "дыры" на скриншоте).
// Теперь для них всегда берём хотя бы средний цвет по реальному фото —
// хуже детализация, но никогда не остаётся пустого/чужеродного пятна.
function bakeTextureAtlas(poseResults, faces, vtList, atlasSize = 1024) {
  const atlas = document.createElement("canvas");
  atlas.width = atlasSize;
  atlas.height = atlasSize;
  const actx = atlas.getContext("2d");
  actx.fillStyle = "#c9a38a";
  actx.fillRect(0, 0, atlasSize, atlasSize);

  const poseKeys = Object.keys(poseResults);

  for (const tri of faces) {
    let best = null;
    for (const key of poseKeys) {
      const { avg, canvas } = poseResults[key];
      const src = tri.map(([vIdx]) => [avg[vIdx].x * canvas.width, avg[vIdx].y * canvas.height]);
      const area = triangleArea2D(src);
      if (!best || area > best.area) best = { area, src, canvas };
    }
    if (!best) continue;

    const dst = tri.map(([, vtIdx]) => {
      const uv = vtList[vtIdx];
      return [uv[0] * atlasSize, (1 - uv[1]) * atlasSize];
    });
    const destArea = triangleArea2D(dst);

    actx.save();
    actx.beginPath();
    actx.moveTo(dst[0][0], dst[0][1]);
    actx.lineTo(dst[1][0], dst[1][1]);
    actx.lineTo(dst[2][0], dst[2][1]);
    actx.closePath();
    actx.clip();

    // источник слишком мал/сильно растянулся бы — заливаем усреднённым
    // цветом с фото вместо блочного/пиксельного пятна
    if (best.area < 10 || destArea / Math.max(best.area, 0.1) > 40) {
      const [r, g, b] = averageColorInTriangle(best.canvas, best.src);
      actx.fillStyle = `rgb(${r | 0},${g | 0},${b | 0})`;
      actx.fillRect(0, 0, atlasSize, atlasSize);
    } else if (affineSetTransform(actx, best.src, dst)) {
      actx.drawImage(best.canvas, 0, 0);
    }
    actx.restore();
  }
  actx.setTransform(1, 0, 0, 1, 0, 0);
  return atlas;
}

// landmark-индекс -> список индексов вершин буфера (может быть несколько
// из-за швов UV-развёртки — нужно для анимации рта, двигать все копии разом)
let landmarkToVertexIds = new Map();

// ---------- Построение персонализированной 3D-сетки лица ----------
function buildFaceMesh(poseResults, faces, vtList) {
  const front = poseResults.front;
  const avgLandmarks = front.avg;
  const imgW = front.canvas.width, imgH = front.canvas.height;
  const nose = avgLandmarks[1];
  const key2idx = new Map();
  const positions = [];
  const uvs = [];
  const indices = [];
  landmarkToVertexIds = new Map();

  function getOrCreate(vIdx, vtIdx) {
    const key = vIdx + "_" + vtIdx;
    if (key2idx.has(key)) return key2idx.get(key);
    const lm = avgLandmarks[vIdx];
    positions.push(
      (lm.x - nose.x) * MESH_SCALE,
      -(lm.y - nose.y) * MESH_SCALE,
      -(lm.z - nose.z) * MESH_SCALE
    );
    const uv = vtList[vtIdx] || [0, 0];
    uvs.push(uv[0], uv[1]);
    const newIdx = positions.length / 3 - 1;
    key2idx.set(key, newIdx);
    if (!landmarkToVertexIds.has(vIdx)) landmarkToVertexIds.set(vIdx, []);
    landmarkToVertexIds.get(vIdx).push(newIdx);
    return newIdx;
  }

  for (const tri of faces) {
    indices.push(
      getOrCreate(tri[0][0], tri[0][1]),
      getOrCreate(tri[1][0], tri[1][1]),
      getOrCreate(tri[2][0], tri[2][1])
    );
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array(positions), 3));
  geometry.setAttribute("uv", new THREE.BufferAttribute(new Float32Array(uvs), 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  geometry.computeBoundingBox();
  const bs = geometry.boundingSphere;
  const box = geometry.boundingBox;

  const atlas = bakeTextureAtlas(poseResults, faces, vtList);
  const texture = new THREE.CanvasTexture(atlas);
  texture.colorSpace = THREE.SRGBColorSpace;

  const material = new THREE.MeshStandardMaterial({
    map: texture,
    side: THREE.DoubleSide,
    roughness: 0.85,
  });

  basePositions = new Float32Array(positions); // копия для анимации рта
  liveGeometry = geometry;

  const mesh = new THREE.Mesh(geometry, material);

  // грубая "голова" позади лица — размер и позиция от реальных габаритов
  // сетки; центр сдвинут так, чтобы ближняя к камере точка шара была
  // строго ЗА самой дальней точкой лица (box.min.z), иначе перекрывает щёки.
  const cheekLm = avgLandmarks[50];
  const cheekPx = Math.min(imgW - 1, Math.round(cheekLm.x * imgW));
  const cheekPy = Math.min(imgH - 1, Math.round(cheekLm.y * imgH));
  const srcCtx = front.canvas.getContext("2d");
  const cheekPixel = srcCtx.getImageData(cheekPx, cheekPy, 1, 1).data;
  const skinColor = new THREE.Color(cheekPixel[0] / 255, cheekPixel[1] / 255, cheekPixel[2] / 255);

  const headRadius = bs.radius * 1.05;
  const headGeo = new THREE.SphereGeometry(headRadius, 24, 24);
  const headMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.9 });
  headPlaceholder = new THREE.Mesh(headGeo, headMat);
  headPlaceholder.position.set(
    bs.center.x,
    bs.center.y - headRadius * 0.15,
    box.min.z - headRadius * 1.1
  );

  const group = new THREE.Group();
  group.add(headPlaceholder);
  group.add(mesh);
  group.userData.boundingSphere = bs;
  return group;
}

// ---------- Анимация: дыхание + рот под звук ----------
function animateAvatar(dt, jawOpen) {
  if (!faceMesh) return;
  const t = performance.now() / 1000;
  faceMesh.position.y = Math.sin(t * 1.2) * 0.01;
  faceMesh.rotation.y = Math.sin(t * 0.5) * 0.02;
  if (state === "ALARM") faceMesh.position.x = (Math.random() - 0.5) * 0.01;

  if (liveGeometry && basePositions) {
    const posAttr = liveGeometry.getAttribute("position");
    for (const lmIdx of MOUTH_INDICES) {
      const vertexIds = landmarkToVertexIds.get(lmIdx) || [];
      for (const vId of vertexIds) {
        posAttr.array[vId * 3 + 1] = basePositions[vId * 3 + 1] - jawOpen * 0.35;
      }
    }
    posAttr.needsUpdate = true;
    liveGeometry.computeVertexNormals();
  }
}

// ---------- Аудио: воспроизведение фразы + громкость для рта ----------
// AudioContext создаём здесь же, при обработке клика — это гарантированный
// "жест пользователя", без которого браузер может молча блокировать звук
// позже, когда тревога сработает сама по таймеру, а не по клику.
function ensureAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playPhrase(url) {
  const ctx = ensureAudioContext();
  if (currentAudioEl) currentAudioEl.pause();
  currentAudioEl = new Audio(url);
  const source = ctx.createMediaElementSource(currentAudioEl);
  analyser = ctx.createAnalyser();
  analyser.fftSize = 512;
  timeData = new Uint8Array(analyser.fftSize);
  source.connect(analyser);
  analyser.connect(ctx.destination);

  const start = () => {
    currentAudioEl.play().catch((e) => {
      console.error("[audio] play() отклонён браузером:", e);
      showError("Браузер заблокировал звук: " + e.message);
    });
  };
  if (ctx.state === "suspended") {
    ctx.resume().then(start).catch((e) => console.error("[audio] resume() не удался:", e));
  } else {
    start();
  }
}

function currentJawOpen() {
  if (!analyser || !currentAudioEl || currentAudioEl.paused) return 0;
  analyser.getByteTimeDomainData(timeData);
  let sum = 0;
  for (let i = 0; i < timeData.length; i++) {
    const v = (timeData[i] - 128) / 128;
    sum += v * v;
  }
  return Math.min(Math.sqrt(sum / timeData.length) * 6, 0.6);
}

// ---------- Камера + детекция лица (полностью локально, в браузере) ----------
let faceLandmarker;

async function createFaceLandmarker() {
  const filesetResolver = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  return FaceLandmarker.createFromOptions(filesetResolver, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU",
    },
    runningMode: "VIDEO",
    numFaces: 1,
  });
}

async function getCameraStream(videoEl) {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 480, height: 360 } });
  videoEl.srcObject = stream;
  await new Promise((res) => (videoEl.onloadedmetadata = res));
  videoEl.play();
  return stream;
}

// ---------- Считывание одного ракурса: N секунд кадров -> усреднённые landmark'и + фото ----------
async function capturePose(durationMs) {
  const collected = [];
  const start = performance.now();

  await new Promise((resolve) => {
    function step() {
      const elapsedMs = performance.now() - start;
      countdownEl.textContent = Math.ceil((durationMs - elapsedMs) / 1000);
      const result = faceLandmarker.detectForVideo(setupVideo, performance.now());
      if (result.faceLandmarks && result.faceLandmarks.length > 0) {
        collected.push(result.faceLandmarks[0]);
      }
      if (elapsedMs < durationMs) requestAnimationFrame(step);
      else resolve();
    }
    step();
  });
  countdownEl.textContent = "";

  if (collected.length < 6) return null;

  const n = collected[0].length;
  const avg = new Array(n);
  for (let i = 0; i < n; i++) {
    let sx = 0, sy = 0, sz = 0;
    for (const frame of collected) { sx += frame[i].x; sy += frame[i].y; sz += frame[i].z; }
    avg[i] = { x: sx / collected.length, y: sy / collected.length, z: sz / collected.length };
  }

  const canvas = document.createElement("canvas");
  canvas.width = setupVideo.videoWidth;
  canvas.height = setupVideo.videoHeight;
  canvas.getContext("2d").drawImage(setupVideo, 0, 0);

  return { avg, canvas };
}

// ---------- Шаг 1: скан лица прямо в приложении, по нескольким ракурсам ----------
async function runScan() {
  scanBtn.disabled = true;
  scanBtn.textContent = "Готовлюсь...";

  faceLandmarker = await createFaceLandmarker();
  await getCameraStream(setupVideo);

  // короткая пауза, чтобы автофокус/экспозиция камеры устаканились
  await new Promise((r) => setTimeout(r, 500));

  const poseResults = {};

  for (const pose of POSES) {
    setupTextEl.textContent = pose.instruction;
    scanBtn.textContent = "Держи так...";
    // пауза, чтобы успеть повернуть голову ДО того, как начнём считать кадры
    await new Promise((r) => setTimeout(r, 1200));

    const result = await capturePose(HOLD_DURATION_MS);
    if (!result) {
      showError(`Не удалось считать лицо в положении "${pose.instruction}". Проверь освещение и не поворачивай голову слишком сильно — лицо должно оставаться в кадре.`);
      scanBtn.disabled = false;
      scanBtn.textContent = "Сканировать лицо";
      setupTextEl.textContent = POSES[0].instruction;
      return;
    }
    poseResults[pose.key] = result;
  }

  setupTextEl.textContent = "Строю 3D-модель...";
  scanBtn.textContent = "Готово";

  colorMatchPoses(poseResults);

  const { faces, vtList } = await fetchCanonicalTopology();
  faceMesh = buildFaceMesh(poseResults, faces, vtList);
  scene.add(faceMesh);

  const bs = faceMesh.userData.boundingSphere;
  const fitDistance = bs.radius / Math.sin((camera.fov * Math.PI / 180) / 2);
  camera.position.set(bs.center.x, bs.center.y, bs.center.z + fitDistance * 1.15);
  camera.lookAt(bs.center);

  // останавливаем поток настройки, переключаемся на постоянный трекинг присутствия
  setupVideo.srcObject.getTracks().forEach((t) => t.stop());
  setupPanel.style.display = "none";

  await loadManifest();
  await startPresenceTracking();
  tick();
}

// ---------- Постоянный трекинг присутствия во время мониторинга ----------
async function startPresenceTracking() {
  const video = document.getElementById("cam");
  await getCameraStream(video);
  detectLoop(video);
}

function detectLoop(video) {
  const result = faceLandmarker.detectForVideo(video, performance.now());
  faceDetected = result.faceLandmarks && result.faceLandmarks.length > 0;
  requestAnimationFrame(() => detectLoop(video));
}

// ---------- Конечный автомат ----------
function updateStateMachine() {
  const now = performance.now() / 1000;
  if (state === "FOCUS") {
    if (!faceDetected) { state = "MISSING"; missingStart = now; }
  } else if (state === "MISSING") {
    if (faceDetected) { state = "RETURN"; returnStart = now; }
    else if (now - missingStart > MISSING_THRESHOLD) {
      state = "ALARM";
      if (phrases.length) playPhrase(phrases[Math.floor(Math.random() * phrases.length)].file);
    }
  } else if (state === "ALARM") {
    if (faceDetected) { state = "RETURN"; returnStart = now; if (currentAudioEl) currentAudioEl.pause(); }
  } else if (state === "RETURN") {
    if (!faceDetected) { state = "ALARM"; missingStart = now; }
    else if (now - returnStart > RETURN_THRESHOLD) { state = "FOCUS"; if (currentAudioEl) currentAudioEl.pause(); }
  }
  const labels = { FOCUS: "AI PARENT IS WATCHING", MISSING: "WARNING: RETURN TO DESK", ALARM: "GET BACK TO WORK!", RETURN: "..." };
  hud.textContent = labels[state];
  hud.style.color = state === "ALARM" ? "#ff4444" : state === "MISSING" ? "#ffaa33" : "#66ff88";
}

let lastTime = performance.now();
function tick() {
  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  updateStateMachine();
  animateAvatar(dt, currentJawOpen());
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

async function loadManifest() {
  try {
    const res = await fetch(PHRASES_MANIFEST);
    phrases = await res.json();
  } catch (e) {
    showError("Не найден " + PHRASES_MANIFEST + " — сначала запусти setup_voice.py");
  }
}

// ---------- Запуск ----------
initScene();
scanBtn.addEventListener("click", () => {
  ensureAudioContext(); // "разблокировать" звук пока есть жест пользователя
  runScan().catch((e) => showError(e.message));
});
getCameraStream(setupVideo).catch((e) => showError("Нет доступа к камере: " + e.message));
</script>
